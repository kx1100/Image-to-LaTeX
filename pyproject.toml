[project]
name = "im2latex"
version = "0.1.0"
description = "Image-to-LaTeX math recognition: photo or scan of math notation to compilable LaTeX."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.2",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "tokenizers>=0.15",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
im2latex = "im2latex.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/im2latex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
