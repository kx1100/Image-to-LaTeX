name: CI

# Verifies N-2 (reproducible environments) on every push: the lockfile still resolves,
# the suite passes on both the development OS and the deployment OS, and the container
# image still builds. The Docker job exists because the Dockerfile is not built during
# day-to-day development on Windows, and an unverified Dockerfile rots silently.

on:
  push:
  pull_request:

env:
  MPLBACKEND: Agg # matplotlib must never look for a display on a runner

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Pinned to the version used for development, so CI cannot resolve
      # differently from the local environment.
      - name: Install uv
        run: python -m pip install uv==0.12.7

      # --frozen fails if uv.lock is out of sync with pyproject.toml, which is
      # what makes the lockfile a real guarantee rather than a snapshot.
      - name: Install from the lockfile
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t im2latex:ci .

      - name: Smoke-test the entrypoint
        run: docker run --rm im2latex:ci version
